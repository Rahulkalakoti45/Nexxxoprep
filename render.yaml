databases:
  - name: nexoprep-postgres
    databaseName: nexoprep
    user: nexoprep
    plan: free

services:
  - type: redis
    name: nexoprep-redis
    plan: free
    ipAllowList: []

  - type: web
    name: nexoprep-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run db:deploy
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: BEHAVIOR_ENGINE_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexoprep-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexoprep-redis
          property: connectionString
      - key: API_KEY_DEV_ONLY
        generateValue: true
      - key: CUSTOM_LLM_SECRET
        generateValue: true
      # Set these manually in the Render dashboard after the blueprint
      # is created (Environment tab) — never checked into git:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      # Set to the frontend's real Render URL once it exists (see below).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: nexoprep-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set these manually once the backend service's URL and its
      # generated API_KEY_DEV_ONLY value are known (see deploy notes).
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_KEY
        sync: false
      - key: VITE_ELEVENLABS_AGENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
