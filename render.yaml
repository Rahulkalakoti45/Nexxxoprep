services:
  - type: web
    name: nexoprep-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run db:deploy
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: BEHAVIOR_ENGINE_ENABLED
        value: "false"
      # External services (Supabase Postgres + Redis Cloud). Set in the Render
      # dashboard, since they contain passwords and must never be in git.
      # DATABASE_URL must be Supabase's *session pooler* string (port 5432):
      # the direct db.<ref>.supabase.co host is IPv6-only and Render is IPv4.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_KEY_DEV_ONLY
        generateValue: true
      - key: CUSTOM_LLM_SECRET
        generateValue: true
      # Set these manually in the Render dashboard after the blueprint
      # is created (Environment tab) — never checked into git:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      # Set to the frontend's real Render URL once it exists (see below).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: nexoprep-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set these manually once the backend service's URL and its
      # generated API_KEY_DEV_ONLY value are known (see deploy notes).
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_KEY
        sync: false
      - key: VITE_ELEVENLABS_AGENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
